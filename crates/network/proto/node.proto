syntax = "proto3";

// O nome do pacote será usado como nome do módulo no Rust
package nas_rpc;

service NodeService {
    // Recebe um pedaço de arquivo de outro nó ou do gateway e salva no HD local
    rpc UploadChunk (UploadChunkRequest) returns (UploadChunkResponse);

    // Lê um pedaço de arquivo do HD local e devolve pela rede
    rpc DownloadChunk (DownloadChunkRequest) returns (DownloadChunkResponse);

    // Checagem rápida de saúde (Heartbeat)
    rpc Ping (PingRequest) returns (PingResponse);
}

message UploadChunkRequest {
    string file_id = 1;
    uint32 sequence_index = 2;
    bytes data = 3; // Em Protobuf, 'bytes' vira um Vec<u8> no Rust!
}

message UploadChunkResponse {
    string chunk_id = 1;
    string checksum = 2;
    uint32 size_bytes = 3;
}

message DownloadChunkRequest {
    string chunk_id = 1;
    string file_id = 2;
    uint32 sequence_index = 3;
    uint32 size_bytes = 4;
    string expected_checksum = 5; // Enviamos o hash esperado para o DiskManager validar bit-rot!
}

message DownloadChunkResponse {
    bytes data = 1;
}

message PingRequest {
    string sender_id = 1;
}

message PingResponse {
    string node_id = 1;
    uint64 free_space_bytes = 2;
}