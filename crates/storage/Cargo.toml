[package]
name = "storage"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../common" }
tokio = { version = "1", features = ["fs", "io-util"] }
sha2 = "0.11.0"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1", features = ["macros", "rt"] }